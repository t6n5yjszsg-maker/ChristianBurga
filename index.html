<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christian Burga</title>
  <style>
    body { font-family: Calibri, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #dbeafe, #fae8ff); color: #1f2d3d; text-align: center; padding: 24px; box-sizing: border-box; }
    .tarjeta { background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(30, 58, 138, 0.15); padding: 56px 48px; max-width: 520px; width: 100%; }
    h1 { color: #1e3a8a; font-size: 2.4rem; margin: 0 0 16px; }
    p { font-size: 1.2rem; margin: 8px 0; }
    .boton-comenzar { margin: 12px 6px 0; padding: 14px 32px; font-size: 1.1rem; font-family: inherit; color: #ffffff; background: #1e6fd9; border: none; border-radius: 999px; cursor: pointer; transition: background 0.2s; }
    .boton-comenzar:hover { background: #1858b0; }
  </style>
</head>
<body>
  <main class="tarjeta">
    <h1>Christian Burga</h1>
    <p>Hackathon de Salud Mental con IA · UCV</p>
    <p>Pídele a Claude que cambie esta página.</p>
    <p id="fecha-actual"></p>
    <button class="boton-comenzar">Comenzar</button>
    <button class="boton-comenzar" type="button">Abrir página</button>
  </main>
  <script>
    document.getElementById('fecha-actual').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  </script>
</body>
</html>
